version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # @types/node must track the minimum supported runtime (engines.node),
      # not the newest Node: types from a newer major typecheck code against
      # APIs that are absent on the runtime these packages promise to support.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [patch]

  # Pinned action SHAs go stale silently; this keeps them current through PRs
  # that show the old and new commit in the diff. CodeQL is its own group: every
  # github/codeql-action step must move to the same version in one PR, or the
  # workflow fails with "All steps ... must use the same version".
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
