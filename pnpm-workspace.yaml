# ── workspace ────────────────────────────────────────────────────────
# One publishable package per extension, plus the theme bundle.
packages:
  - "pi-extensions/*"

# ── supply-chain policy ──────────────────────────────────────────────
# Sources:
#   lirantal/npm-security-best-practices
#   pnpm supply chain docs — https://pnpm.io/supply-chain-security

# No dependency may run an install script unless it is approved here by name
# and by decision. `pnpm approve-builds <pkg>` / `!<pkg>` maintains this map.
# esbuild is the only approval: its postinstall links the platform binary that
# arrives as a pinned optionalDependency. Denials are recorded too, so a
# dependency that later adds a script fails the install instead of silently
# gaining code execution.
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false

# Fail the install when a dependency wants a script that is neither approved
# nor denied above.
strictDepBuilds: true

# Dependencies must come from the registry: git and tarball URLs bypass
# registry scanning, provenance and signature checks.
blockExoticSubdeps: true

# Refuse packages published less than a day ago, so a compromised release has
# a window to be caught before it lands here.
minimumReleaseAge: 1440

# Refuse a version downgrade relative to the lockfile. One exclusion: undici-types
# is types-only (erased at build time, no runtime code) and its 6.x line trips the
# heuristic; excluding it keeps the check on for everything that actually runs.
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types
